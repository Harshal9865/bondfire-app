name: Bondfire CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_password_2026
          POSTGRES_DB: bondfire_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Validate Database Migrations
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL service to accept connections..."
            sleep 2
          done
          PGPASSWORD=postgres_secure_password_2026 psql -h localhost -U postgres -d bondfire_db -f database/schema.sql
          PGPASSWORD=postgres_secure_password_2026 psql -h localhost -U postgres -d bondfire_db -f database/seed.sql

      - name: Run Frontend & Core Logic Tests
        run: npm test

      - name: Compile TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Unit & Integration Tests
        working-directory: ./backend
        run: npm test

      - name: Lint Source Code
        working-directory: ./backend
        run: npm run lint
