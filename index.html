<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bondfire — Party games made from your own memories</title>
  
  <!-- SEO & Open Graph Meta -->
  <meta name="description" content="No generic trivia. Drop in your group chats, real photos, and inside jokes. Bondfire auto-generates hilarious social party games and physical yearbooks for Couples, Squads, and Solo." />
  <meta property="og:title" content="Bondfire — Social Memory Play & Keepsakes" />
  <meta property="og:description" content="Party games made from your own memories. Zero gambling, 100% real inside jokes." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0B0E17" />

  <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- Google Identity Services (GSI) SDK for Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23FF5A5F' d='M12 2C12 2 13.8 6.2 16 8.5C18.2 10.8 21 12 21 12C21 12 18.2 13.2 16 15.5C13.8 17.8 12 22 12 22C12 22 10.2 17.8 8 15.5C5.8 13.2 3 12 3 12C3 12 5.8 10.8 8 8.5C10.2 6.2 12 2 12 2Z'/><circle fill='%23FFB703' cx='12' cy='12' r='3'/></svg>" />
  <link rel="alternate icon" href="/favicon.ico" />

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Tailwind CSS Compiled Output -->
  <link rel="stylesheet" href="css/output.css" />

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/modes.css" />
  <link rel="stylesheet" href="css/canvas-shader.css" />
  <link rel="stylesheet" href="css/book-3d.css" />
  <style>
    .mesh-gradient {
      background: radial-gradient(circle at 20% 15%, rgba(255, 90, 95, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 80% 25%, rgba(255, 183, 3, 0.10) 0%, transparent 40%),
                  radial-gradient(circle at 50% 70%, rgba(247, 37, 133, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 15% 85%, rgba(74, 222, 128, 0.07) 0%, transparent 40%);
    }
    .cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(38, 43, 64, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(38, 43, 64, 0.35) 1px, transparent 1px);
    }
    .book-spine-3d {
      transform: perspective(1400px) rotateY(-18deg) rotateX(10deg);
      box-shadow: -25px 25px 50px -10px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 183, 3, 0.15);
    }
    .glass-pill {
      background: rgba(22, 25, 38, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(38, 43, 64, 0.8);
    }
  </style>
</head>
<body data-mode="PODS">

  <!-- OpenAI / Gemini Fluid Ambient Particle Canvas -->
  <div id="bg-canvas-container">
    <canvas id="bg-canvas"></canvas>
    <div class="hero-glow-orb"></div>
    <div class="mesh-overlay"></div>
  </div>

  <!-- Celebration Confetti Layer -->
  <canvas id="confetti-canvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999;"></canvas>

  <!-- Global Navigation Header Mount -->
  <div id="header-mount"></div>

  <!-- Main View Dynamic Mount -->
  <main id="app-mount"></main>

  <!-- Global Footer Mount -->
  <div id="footer-mount"></div>

  <!-- Global Toast Mount -->
  <div id="toast-mount" class="toast-container"></div>

  <!-- Global Modal Mount for Auth & Checkout Simulator -->
  <div id="modal-mount"></div>

  <!-- Master Application Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
