  <!-- Console Diagnostics Silencer (Suppresses benign Google GSI COOP postMessage logs & Tailwind CDN warnings) -->
  <script>
    (function() {
      const _error = console.error;
      const _warn = console.warn;
      const ignoredPatterns = [
        'Cross-Origin-Opener-Policy',
        'postMessage',
        'cdn.tailwindcss.com',
        'GSI_LOGGER',
        'FedCM'
      ];
      function shouldIgnore(args) {
        try {
          const str = args.map(a => {
            if (typeof a === 'string') return a;
            if (a instanceof Error) return a.message + ' ' + (a.stack || '');
            if (typeof a === 'object' && a !== null) {
              try { return JSON.stringify(a); } catch (err) { return String(a); }
            }
            return String(a);
          }).join(' ');
          return ignoredPatterns.some(pattern => str.includes(pattern));
        } catch (e) {
          return false;
        }
      }
      console.error = function(...args) {
        if (shouldIgnore(args)) return;
        _error.apply(console, args);
      };
      console.warn = function(...args) {
        if (shouldIgnore(args)) return;
        _warn.apply(console, args);
      };
      window.addEventListener('error', function(e) {
        if (e && e.message && ignoredPatterns.some(pattern => e.message.includes(pattern))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    })();
  </script>

  <!-- Automatic PWA Cache Invalidation for New Releases -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let reg of registrations) {
          reg.update();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        keys.forEach(function(key) {
          if (key !== 'bondfire-v16') {
            caches.delete(key);
          }
        });
      });
    }
  </script>
