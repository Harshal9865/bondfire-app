# ==============================================================================
# BONDFIRE DOCKER COMPOSE ORCHESTRATION (Production-Ready Stack)
# Services: PostgreSQL 16+, Redis 7+, Fastify Backend API, Nginx Edge Frontend
# ==============================================================================

version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bondfire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bondfire_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bondfire-network

  # 2. Redis Cache & Real-Time Room Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: bondfire-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bondfire-network

  # 3. Fastify Backend API & WebSocket Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bondfire-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${POSTGRES_DB:-bondfire_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-super_secure_bondfire_jwt_secret_key_2026_at_least_32_chars_long!}
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bondfire-network

  # 4. Frontend Nginx Edge Container
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bondfire-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - bondfire-network

volumes:
  pgdata:
  redisdata:

networks:
  bondfire-network:
    driver: bridge
